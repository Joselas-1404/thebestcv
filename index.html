<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Language</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
    <div id="password-screen" class="text-center flex flex-col justify-center items-center h-full">
        <h1 class="text-2xl font-bold mb-4">Enter Password</h1>
        <input type="password" id="password-input" class="p-2 border rounded-md mb-4" placeholder="Enter password">
        <button onclick="checkPassword()" class="bg-blue-500 text-white px-4 py-2 rounded-md">Submit</button>
        <p id="error-message" class="text-red-500 mt-2 hidden">Incorrect password, try again.</p>
    </div>

    <div id="content" class="hidden text-center flex flex-col justify-center items-center h-full">
        <h1 class="text-3xl font-bold mb-6">Escoge el idioma - Choose the language</h1>
        <div class="flex space-x-6">
            <a href="entry.html" class="block w-48 p-6 bg-white shadow-lg rounded-xl hover:scale-105 transition">
                <span class="text-lg font-semibold">Español - Spanish</span>
            </a>
            <a href="inde2.html" class="block w-48 p-6 bg-white shadow-lg rounded-xl hover:scale-105 transition">
                <span class="text-lg font-semibold">Inglés - English</span>
            </a>
        </div>
    </div>

    <script>
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(byte => byte.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const inputPassword = document.getElementById("password-input").value;
            const correctHash = "492def46f84c71f11c0f7233fd75bff5d3e56912b7f0122380d6a49dcf36e564"; // Hash of "secureAccess2025"

            const inputHash = await hashPassword(inputPassword);

            if (inputHash === correctHash) {
                document.getElementById("password-screen").classList.add("hidden");
                document.getElementById("content").classList.remove("hidden");
            } else {
                document.getElementById("error-message").classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
